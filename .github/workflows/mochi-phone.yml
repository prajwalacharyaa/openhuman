# Mochi phone: the Android app that lets Mochi call December (mochi-phone/, see its README).
#
#   - every push touching mochi-phone/: a debug build, to check it compiles
#   - a tag like phone-v1: a signed release APK + SHA256SUMS on a GitHub release
#
# Release signing needs two repository secrets (Settings > Secrets and variables > Actions):
#   MOCHI_KEYSTORE_B64       base64 of the PKCS#12 signing key (line breaks are fine) (the server keeps the original, see README)
#   MOCHI_KEYSTORE_PASSWORD  its password
# Android only installs an update signed with the same key, so the key never changes.
name: Mochi phone

on:
  push:
    branches: [tiny]
    tags: ["phone-v*"]
    paths: ["mochi-phone/**", ".github/workflows/mochi-phone.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mochi-phone-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RELEASE: ${{ github.ref_type == 'tag' }}
      MOCHI_VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
      MOCHI_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          sparse-checkout: mochi-phone
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      # Gradle itself, checked against its official SHA-256: from Gradle's servers, else a mirror (Gradle's servers
      # pass downloads on to GitHub release files, which kept returning 504s on 2026-11-08)
      - name: Gradle 8.11.1
        run: |
          sum=f397b287023acdba1e9f6fc5ea72d22dd63669d59ed4a289a29b1a76eee151c6
          zip="$RUNNER_TEMP/gradle.zip"
          for url in https://services.gradle.org/distributions/gradle-8.11.1-bin.zip \
                     https://downloads.gradle.org/distributions/gradle-8.11.1-bin.zip \
                     https://mirrors.cloud.tencent.com/gradle/gradle-8.11.1-bin.zip; do
            for try in 1 2 3; do
              curl -fsSL --retry 3 --max-time 300 -o "$zip" "$url" && echo "$sum  $zip" | sha256sum -c --quiet && break 2
              rm -f "$zip"; sleep 10
            done
          done
          [ -f "$zip" ] || { echo "::error title=Gradle::couldn't download Gradle 8.11.1 with the right checksum"; exit 1; }
          unzip -q "$zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.11.1/bin" >> "$GITHUB_PATH"
      - uses: gradle/actions/setup-gradle@v4
        with:
          # save the download cache from this branch too (by default only the default branch writes it), so builds
          # don't fetch Gradle and every library again each time
          cache-read-only: false
      - name: Signing key
        if: env.RELEASE == 'true'
        env:
          KEY_B64: ${{ secrets.MOCHI_KEYSTORE_B64 }}
        run: |
          [ -n "$KEY_B64" ] || { echo "::error::MOCHI_KEYSTORE_B64 secret is missing (mochi-phone/README.md)"; exit 1; }
          echo "$KEY_B64" | base64 -d > "$RUNNER_TEMP/mochi.p12"
          echo "MOCHI_KEYSTORE=$RUNNER_TEMP/mochi.p12" >> "$GITHUB_ENV"
      - name: Check signing key
        if: env.RELEASE == 'true'
        env:
          MOCHI_KEYSTORE_PASSWORD: ${{ secrets.MOCHI_KEYSTORE_PASSWORD }}
        run: |
          keytool -list -storetype pkcs12 -keystore "$MOCHI_KEYSTORE" -storepass:env MOCHI_KEYSTORE_PASSWORD -alias mochi \
            >/dev/null 2>&1 || { echo "::error title=Signing key::Can't read the key ($(stat -c %s "$MOCHI_KEYSTORE") bytes, \
          password ${#MOCHI_KEYSTORE_PASSWORD} chars). Re-paste MOCHI_KEYSTORE_B64 (usually copied incompletely) \
          or MOCHI_KEYSTORE_PASSWORD: see mochi-phone/README.md"; exit 1; }
      - name: Build
        env:
          MOCHI_KEYSTORE_PASSWORD: ${{ secrets.MOCHI_KEYSTORE_PASSWORD }}
        run: |
          # on failure, put Gradle's error summary in a public annotation (job logs need a login to read)
          fail() { grep -E -A12 "What went wrong|^e: |error:" build.log | head -60 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' \
                     | sed 's/^/::error title=Gradle::/'; exit 1; }
          if [ "$RELEASE" = true ]; then
            gradle -p mochi-phone --no-daemon assembleRelease > build.log 2>&1 || fail
            cp mochi-phone/app/build/outputs/apk/release/app-release.apk "mochi-$MOCHI_VERSION_NAME.apk"
            # R8's name map: a crash report's obfuscated names (t0.D.z) decode only with the map of that exact build
            cp mochi-phone/app/build/outputs/mapping/release/mapping.txt "mochi-$MOCHI_VERSION_NAME-mapping.txt"
          else
            gradle -p mochi-phone --no-daemon assembleDebug > build.log 2>&1 || fail
            cp mochi-phone/app/build/outputs/apk/debug/app-debug.apk mochi-dev.apk
          fi
          rm -f "$RUNNER_TEMP/mochi.p12"
          sha256sum mochi-*.apk > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: mochi-phone
          path: |
            mochi-*.apk
            mochi-*-mapping.txt
            SHA256SUMS

  release:
    name: Publish GitHub release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: mochi-phone
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # --latest=false: the desktop app's updater reads this fork's latest release, which must stay a Tiny build
          gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --target "${{ github.sha }}" --latest=false \
            --title "Mochi phone ${{ github.ref_name }}" \
            --notes "Android app for Mochi's calls. Install the APK on your phone (allow installs from your browser). Check it against SHA256SUMS." \
            mochi-*.apk mochi-*-mapping.txt SHA256SUMS
