---
# Tiny build: our personal OpenHuman build (prajwalacharyaa/openhuman, branch `tiny`).
#
# Upstream's release pipeline (release-production.yml / build-desktop.yml) needs TinyHumans' signing keys,
# Sentry and GitHub App secrets, so it can't run on this fork. This workflow builds the same Tauri app
# without any of that:
#   - test:    the unit tests our patches touch (voice, voice recap, memory hooks)
#   - build:   Linux .deb (also what the xarvis-core server runs headless) + Windows NSIS installer.
#              macOS is kept below but switched off.
#   - release: on a tag like v0.64.15-tiny.1, publishes a GitHub release with the installers and
#              SHA256SUMS (tiny-setup's versions.conf pins the .deb by that checksum).
#
# The updater points at THIS fork's releases, so upstream releases can never overwrite our patches.
# Builds are unsigned (personal use over Tailscale): Windows SmartScreen asks "More info > Run anyway".
name: Tiny build

on:
  push:
    tags: ["v*-tiny.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "App version for an untagged test build (e.g. 0.64.15-tiny.0)"
        required: false
        default: "0.64.15-tiny.0"

permissions:
  contents: read

concurrency:
  group: tiny-build-${{ github.ref }}
  cancel-in-progress: true

env:
  # tag v0.64.15-tiny.1 -> 0.64.15-tiny.1; manual runs use the input
  TINY_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Unit tests (patched areas)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # debug info roughly doubles the test build on disk; the runner has ~14 GB free
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.96.1
      - name: System libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libssl-dev libclang-dev cmake libasound2-dev libxdo-dev libevdev-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev mold >/dev/null
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: tiny-test-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: tiny-test-${{ runner.os }}-
      - name: cargo test (voice, voice tool harness and shell gate, voice recap, memory hooks, Claude session cap, upstream picks, Claude Code driver)
        shell: bash
        run: |
          set -o pipefail
          cargo test --manifest-path Cargo.toml -p openhuman --lib -- \
            voice::live live_harness voice_shell voice_recap memory::lifecycle claude_session_cap layout_migration::service \
            protected_literal literal_credential_paths the_bus_logger_names_events security::pairing \
            memory::sources::sync memory::backfill harness_context_ladder title_and_cancellation_tests shell::tests::timeout_tests \
            2>&1 | tee test.log
          # tinyagents comes from our fork (Claude Code driver fixes): run that driver's own tests too
          cargo test --manifest-path vendor/tinyagents/Cargo.toml -p tinyagents-harness --lib -- providers::claude_code 2>&1 | tee -a test.log
      # job logs need admin rights to download; annotations are public, so a failure can be read from the API
      - name: Report test failures as annotations
        if: failure()
        shell: bash
        run: |
          # CARGO_TERM_COLOR=always puts colour codes in test.log: strip them, or nothing matches
          sed 's/\x1b\[[0-9;]*m//g' test.log | grep -E -A6 '^error(\[E[0-9]+\])?:|panicked at|^test .* FAILED' | head -60 \
            | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' | sed 's/^/::error title=cargo test::/'; echo

  build:
    name: Build ${{ matrix.settings.name }}
    needs: test
    runs-on: ${{ matrix.settings.platform }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        settings:
          - name: linux-x64
            platform: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            # .deb only: the server and a Linux desktop both install it. (AppImage skipped to save time.)
            bundles: deb
          - name: windows-x64
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            # NSIS only: MSI refuses pre-release versions like 0.64.15-tiny.1
            bundles: nsis
          # macOS: kept for later, not built yet (unsigned macOS builds also need right-click > Open).
          # - name: macos-arm64
          #   platform: macos-latest
          #   target: aarch64-apple-darwin
          #   bundles: dmg
    steps:
      - name: Free disk space (linux)
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: recursive
      - uses: pnpm/action-setup@v6
        with:
          version: 10.10.0
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - uses: dtolnay/rust-toolchain@1.96.1
      - name: Tauri system libraries (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf cmake libasound2-dev libxdo-dev libxtst-dev libx11-dev libxi-dev libevdev-dev libssl-dev \
            libclang-dev desktop-file-utils xdg-utils mold >/dev/null
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: tiny-build-${{ matrix.settings.name }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: tiny-build-${{ matrix.settings.name }}-
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
      # the pinned module archives come from GitHub release files, which time out (504) at times: keep them
      # between builds (saved right after a good download, even if a later step fails), so a rebuild never re-fetches
      - name: Restore module archives
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/modules-cache
          key: modules-${{ matrix.settings.target }}-${{ hashFiles('crates/openhuman-core/src/modules/registry.rs', 'crates/openhuman-core/src/modules/registry/*.rs') }}
          restore-keys: modules-${{ matrix.settings.target }}-
      - name: Bundle pinned native modules
        shell: bash
        env:
          MODULES_CACHE_DIR: ${{ runner.temp }}/modules-cache
        run: node scripts/release/stage-modules.mjs --target "${{ matrix.settings.target }}"
      - name: Save module archives
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/modules-cache
          key: modules-${{ matrix.settings.target }}-${{ hashFiles('crates/openhuman-core/src/modules/registry.rs', 'crates/openhuman-core/src/modules/registry/*.rs') }}
        continue-on-error: true  # already saved by an earlier build with the same pins
      - name: Build and package
        shell: bash
        working-directory: app
        env:
          OPENHUMAN_APP_ENV: production
          VITE_OPENHUMAN_APP_ENV: production
          VITE_BACKEND_URL: https://api.tinyhumans.ai
          OPENHUMAN_BUILD_SHA: ${{ github.sha }}
          VITE_BUILD_SHA: ${{ github.sha }}
          # same linker flags as upstream's Linux release build
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: -C link-arg=-fuse-ld=mold -C link-arg=-Wl,--icf=safe
        run: |
          VERSION="${TINY_VERSION#v}"
          # our version + our updater endpoint (never upstream's)
          OVERRIDE=$(printf '{"version":"%s","plugins":{"updater":{"endpoints":["https://github.com/%s/releases/latest/download/latest.json"]}}}' \
            "$VERSION" "${{ github.repository }}")
          echo "Tauri config override: $OVERRIDE"
          NODE_OPTIONS="--max-old-space-size=8192" pnpm tauri build -c "$OVERRIDE" \
            --target "${{ matrix.settings.target }}" --bundles "${{ matrix.settings.bundles }}"
      - name: Collect installers
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p out
          for root in "crates/openhuman-app/target/${{ matrix.settings.target }}/release/bundle" \
                      "target/${{ matrix.settings.target }}/release/bundle"; do
            for f in "$root"/deb/*.deb "$root"/nsis/*-setup.exe "$root"/dmg/*.dmg; do cp "$f" out/; done
          done
          ls -la out
          [ -n "$(ls out)" ] || { echo "no installers found"; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: tiny-${{ matrix.settings.name }}
          path: out/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    # also when only Windows failed: the server needs just the Linux .deb (Windows' installer step downloads NSIS
    # from GitHub release files, which returned 504s on 2026-11-08); the Windows installer is added when it built
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd dist
          ls ./*.deb >/dev/null 2>&1 || { echo "::error title=Release::no Linux .deb built: nothing to release"; exit 1; }
          note=""
          ls ./*.exe >/dev/null 2>&1 || note=" Windows installer missing from this build (its job failed): use the previous release's on PCs."
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
          gh release create "$TAG" --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "Tiny $TAG" \
            --notes "Personal OpenHuman build (branch tiny). Patches: see the commits since the upstream base tag. Unsigned; Windows: More info > Run anyway.$note" \
            ./*
