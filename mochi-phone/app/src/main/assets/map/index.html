<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<!-- No network: the app's WebView answers every request except this folder's two files with nothing. -->
<title>Project map</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); font-family: sans-serif; }
  :root { --bg: #FFFFFF; --ink: #111111; --muted: #5F6368; }
  body.dark { --bg: #111214; --ink: #F1F2F4; --muted: #A6ABB3; }
  #map { position: absolute; inset: 0; }
</style>
<script src="vis-network.min.js"></script>
</head>
<body>
<div id="map"></div>
<script>
window.onerror = (msg, src, line) => { try { Android.failed(String(msg) + ' (line ' + line + ')'); } catch (e) {} };
// The project map: a project's Graphify graph (graph.json) drawn with vis-network.
// Starts with the main points (the most connected nodes); a tap focuses a node, adds its neighbours and asks the
// app to show its details (Android.select). The app calls focusNode(id), expandAll(id), mainPoints().
const dark = location.search.includes('dark=1');
if (dark) document.body.classList.add('dark');
const INK = dark ? '#F1F2F4' : '#111111';
const MUTED = dark ? '#A6ABB3' : '#5F6368';
const PALETTE = ['#2A55AE', '#1E7A45', '#5B3FC4', '#8A4B00', '#B4472C', '#0E7490', '#A21CAF', '#4D7C0F', '#9F1239', '#334155'];
const PALETTE_DARK = ['#8FB2FF', '#7FD3A0', '#BCA8FF', '#F2B866', '#E07A5F', '#67E8F9', '#F0ABFC', '#BEF264', '#FDA4AF', '#CBD5E1'];
const MAIN = 40, NEIGHBOURS = 25;

const g = JSON.parse(Android.graph());
const byId = new Map(g.nodes.map(n => [n.id, n]));
const links = (g.links || g.edges || []).filter(l => byId.has(l.source) && byId.has(l.target) && l.source !== l.target);
const adj = new Map();
for (const l of links) {
  if (!adj.has(l.source)) adj.set(l.source, []);
  if (!adj.has(l.target)) adj.set(l.target, []);
  adj.get(l.source).push({ id: l.target, rel: l.relation || 'links', out: true });
  adj.get(l.target).push({ id: l.source, rel: l.relation || 'links', out: false });
}
const degree = id => (adj.get(id) || []).length;
const colour = n => (dark ? PALETTE_DARK : PALETTE)[Math.abs(Number(n.community) || 0) % PALETTE.length];

const nodes = new vis.DataSet();
const edges = new vis.DataSet();
function visNode(n) {
  const d = degree(n.id);
  return { id: n.id, label: n.label || n.id, value: d + 1, color: { background: colour(n), border: colour(n),
    highlight: { background: INK, border: INK } }, font: { color: INK, size: 14, strokeWidth: 3,
    strokeColor: dark ? '#111214' : '#FFFFFF' }, shape: 'dot' };
}
function add(ids) {
  const fresh = ids.filter(id => !nodes.get(id) && byId.has(id));
  nodes.add(fresh.map(id => visNode(byId.get(id))));
  const shown = new Set(nodes.getIds());
  const newEdges = [];
  for (const l of links) {
    const key = l.source + '>' + l.target + ':' + (l.relation || '');
    if (shown.has(l.source) && shown.has(l.target) && !edges.get(key)) {
      newEdges.push({ id: key, from: l.source, to: l.target, arrows: { to: { enabled: true, scaleFactor: 0.4 } },
        color: { color: MUTED, opacity: 0.35, highlight: INK }, width: 1, smooth: false });
    }
  }
  edges.add(newEdges);
  if (fresh.length && net) { net.setOptions({ physics: { enabled: true } }); }
}
let fitWhenSettled = true;
function mainPoints() {
  nodes.clear(); edges.clear();
  const top = g.nodes.map(n => n.id).sort((a, b) => degree(b) - degree(a)).slice(0, MAIN);
  fitWhenSettled = true;
  add(top);
  if (net) {
    net.stabilize(150);  // lay it out now (fires stabilizationIterationsDone → fit) instead of drifting for seconds
    setTimeout(() => { if (!touched) net.fit({ animation: false }); report('after 2.5 s'); }, 2500);  // fit again, in any case
  }
}
function details(id) {
  const n = byId.get(id) || {};
  const seen = new Set();
  const conns = (adj.get(id) || []).filter(c => !seen.has(c.id + c.rel) && seen.add(c.id + c.rel))
    .sort((a, b) => degree(b.id) - degree(a.id)).slice(0, 200)
    .map(c => ({ id: c.id, label: (byId.get(c.id) || {}).label || c.id, rel: c.rel.replace(/_/g, ' '), out: c.out }));
  return JSON.stringify({ id, label: n.label || id, type: n.file_type || '', file: n.source_file || '',
    where: n.source_location || '', group: n.community_name || '', connections: conns, total: degree(id) });
}
function focusNode(id, expand) {
  if (!net || !byId.has(id)) return;
  const near = (adj.get(id) || []).map(c => c.id).sort((a, b) => degree(b) - degree(a));
  add([id].concat(expand === 'all' ? near : near.slice(0, NEIGHBOURS)));
  net.selectNodes([id]);
  setTimeout(() => net.focus(id, { scale: 1.1, animation: { duration: 400 } }), 60);
  Android.select(details(id));
}
function expandAll(id) { focusNode(id, 'all'); }
function find(text) {
  const t = text.toLowerCase();
  const hit = g.nodes.filter(n => (n.label || '').toLowerCase().includes(t)).sort((a, b) => degree(b.id) - degree(a.id))[0];
  if (hit) focusNode(hit.id); else Android.notFound(text);
}

// The map is created only once its box has a real size: an Android WebView can start at 0x0, and a map laid out
// and fitted in a 0x0 box ends up off-screen. Until December moves or zooms it, it re-fits when its size changes.
const box = document.getElementById('map');
let net = null, touched = false;
function report(what) {
  // progress for the phone's log (adb logcat -s MochiMap): where the map is and what it shows
  try {
    const pos = Object.values(net.getPositions());
    const xs = pos.map(p => p.x), ys = pos.map(p => p.y);
    const canvas = box.querySelector('canvas');
    console.log('map ' + what + ': box ' + box.clientWidth + 'x' + box.clientHeight + ', canvas ' +
      (canvas ? canvas.width + 'x' + canvas.height : 'none') + ', dpr ' + devicePixelRatio + ', scale ' + net.getScale().toFixed(3) +
      ', view ' + JSON.stringify(net.getViewPosition()) + ', nodes ' + pos.length + ', x ' + Math.min(...xs).toFixed(0) +
      '..' + Math.max(...xs).toFixed(0) + ', y ' + Math.min(...ys).toFixed(0) + '..' + Math.max(...ys).toFixed(0));
  } catch (e) { console.log('map report failed: ' + e); }
}
function settled() {
  net.setOptions({ physics: { enabled: false } }); // physics only while a layout settles (it costs battery)
  if (fitWhenSettled) { fitWhenSettled = false; net.fit({ animation: false }); }
  report('settled');
}
function start() {
  console.log('map start: box ' + box.clientWidth + 'x' + box.clientHeight + ', ' + g.nodes.length + ' nodes');
  net = new vis.Network(box, { nodes, edges }, {
    nodes: { scaling: { min: 6, max: 34, label: { enabled: true, min: 14, max: 26, drawThreshold: 5 } } },
    physics: { solver: 'barnesHut', barnesHut: { gravitationalConstant: -2500, centralGravity: 0.9, springLength: 110, avoidOverlap: 0.4 },
      stabilization: { iterations: 120, fit: false } },
    interaction: { hover: false, tooltipDelay: 999999, zoomView: true, dragView: true, multiselect: false },
    layout: { improvedLayout: false },
  });
  net.on('stabilizationIterationsDone', settled);
  net.on('stabilized', settled);
  net.on('dragStart', () => { touched = true; });
  net.on('zoom', () => { touched = true; });
  net.on('click', p => { if (p.nodes.length) focusNode(p.nodes[0]); else Android.select(''); });
  mainPoints();
  Android.ready(String(g.nodes.length), String(links.length));
}
let lastW = 0, lastH = 0;
console.log('map page loaded: box ' + box.clientWidth + 'x' + box.clientHeight + ', window ' + innerWidth + 'x' + innerHeight);
new ResizeObserver(() => {
  const w = box.clientWidth, h = box.clientHeight;
  console.log('map resize: ' + w + 'x' + h);
  if (w < 10 || h < 10) return;
  if (!net) { lastW = w; lastH = h; start(); return; }
  if (Math.abs(w - lastW) + Math.abs(h - lastH) > 20) {
    lastW = w; lastH = h;
    net.setSize(w + 'px', h + 'px'); net.redraw();
    if (!touched) net.fit();
  }
}).observe(box);
</script>
</body>
</html>
