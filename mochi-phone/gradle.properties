org.gradle.jvmargs=-Xmx2g
# Porcupine pulls in androidx.core
android.useAndroidX=true
kotlin.code.style=official
# CI: ride out brief download timeouts (GitHub release assets behind Maven Central returned 504s on 2026-11-08)
systemProp.org.gradle.internal.repository.max.tentatives=6
systemProp.org.gradle.internal.repository.initial.backoff=2000
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.org.gradle.internal.http.connectionTimeout=120000
